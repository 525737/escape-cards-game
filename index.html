<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>2枚のカードで脱出</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{

--felt:#1d4a3a; --felt-deep:#12332a; --paper:#f6f3ec; --ink:#1b1b1b;

--red:#c8102e; --gold:#d9b45a; --muted:#a9c3b6; --line:rgba(255,255,255,.14);

color-scheme: light dark;

box-sizing:border-box;

padding-top:env(safe-area-inset-top,0px);

padding-bottom:env(safe-area-inset-bottom,0px);

}

@media (prefers-color-scheme: dark){

:root:not([data-theme="light"]){ --felt:#163a2e; --felt-deep:#0c241d; --muted:#8fb0a1; }

}

:root[data-theme="dark"]{ --felt:#163a2e; --felt-deep:#0c241d; --muted:#8fb0a1; }

*,*::before,*::after{box-sizing:inherit}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{

margin:0; min-height:100%;

background:radial-gradient(ellipse at 50% 0%, var(--felt), var(--felt-deep) 75%);

background-color:var(--felt-deep);

color:var(--paper);

font-family:"Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;

line-height:1.6;

}

main{max-width:520px;margin:0 auto;padding:20px 18px 32px}

h1{

font-family:"Dela Gothic One","Hiragino Sans",sans-serif; font-weight:400;

font-size:1.6rem; line-height:1.25; margin:8px 0 6px; letter-spacing:.02em;

}

.lead{color:var(--muted);margin:0 0 18px;font-size:.95rem}

.targets{display:flex;gap:12px;margin-bottom:18px}

.card{

flex:1; aspect-ratio:5/7; max-width:120px;

background:var(--paper); color:var(--ink); border-radius:10px;

position:relative; display:flex; align-items:center; justify-content:center;

font-family:"Dela Gothic One",sans-serif; font-size:2.6rem;

box-shadow:0 6px 18px rgba(0,0,0,.35);

opacity:.38; transform:rotate(-3deg); transition:opacity .3s, transform .3s;

}

.card + .card{transform:rotate(3deg)}

.card.found{opacity:1; outline:3px solid var(--gold); outline-offset:3px}

.card .corner{position:absolute;top:6px;left:8px;font-size:.95rem;line-height:1.1;text-align:center}

.card.h{color:var(--red)}

.cam{

position:relative; width:100%; aspect-ratio:3/4; border-radius:14px; overflow:hidden;

background:#000; border:1px solid var(--line);

}

.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}

.cam .empty{

position:absolute;inset:0;display:flex;align-items:center;justify-content:center;

text-align:center;padding:24px;color:var(--muted);font-size:.95rem

}

.actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}

button,.filebtn{

font:inherit; font-weight:700; font-size:1.05rem; border:0; border-radius:12px;

padding:15px; cursor:pointer; text-align:center; width:100%;

}

.primary{background:var(--gold);color:#2a2105}

.secondary{background:transparent;color:var(--paper);border:1px solid var(--line)}

button:disabled{opacity:.5;cursor:default}

button:focus-visible,.filebtn:focus-within{outline:3px solid var(--paper);outline-offset:2px}

input[type=file]{position:absolute;width:1px;height:1px;opacity:0}

.status{min-height:3em;margin-top:14px;font-size:.95rem;color:var(--muted)}

.status strong{color:var(--paper)}

#win{

position:fixed; inset:0; z-index:20; display:none;

align-items:center; justify-content:center; flex-direction:column; text-align:center;

background:rgba(8,20,16,.92); padding:24px;

}

#win.show{display:flex}

#win h2{

font-family:"Dela Gothic One",sans-serif;font-weight:400;

font-size:clamp(3rem,18vw,6rem);margin:0;color:var(--gold);line-height:1.1;

animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;

}

#win p{color:var(--paper);margin:14px 0 28px}

#win button{max-width:260px}

@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

@media (prefers-reduced-motion: reduce){ #win h2{animation:none} .card{transition:none} }

</style>

</head>

<body>

<main>

<h1>扉を開けるのは、2枚のカード</h1>

<p class="lead">クラブの10とハートの10を赤い枠の中に置き、枠ごと写してください。</p>



<div class="targets" aria-label="必要なカード">

<div class="card h" id="c-h"><span class="corner">10<br>♥</span>♥</div>

<div class="card" id="c-s"><span class="corner">10<br>♣</span>♣</div>

</div>



<div class="cam" id="cam">

<video id="video" playsinline muted autoplay hidden></video>

<img id="preview" alt="撮影したカード" hidden>

<div class="empty" id="empty">「カメラを起動」を押してカードを映してください</div>

</div>



<div class="actions">

<button class="primary" id="mainBtn">カメラを起動</button>

<label class="filebtn secondary">写真を撮って判定

<input type="file" id="file" accept="image/*" capture="environment">

</label>

</div>



<div class="status" id="status" aria-live="polite"></div>

</main>



<div id="win" role="dialog" aria-label="脱出成功">

<h2>脱出成功</h2>

<p>赤枠の中にクラブの10とハートの10を確認しました。</p>

<button class="primary" id="again">もう一度遊ぶ</button>

</div>



<script>

const $ = id => document.getElementById(id);

const video=$("video"), preview=$("preview"), empty=$("empty"),

mainBtn=$("mainBtn"), fileIn=$("file"), statusEl=$("status");

let stream=null, sample=null, busy=false;



const setStatus = html => { statusEl.innerHTML = html; };



(window.claude ? claude.use("sample") : Promise.resolve(null)).then(s => {

sample = s;

if(!s) setStatus("このページではカード判定（Claude）が使えません。claude.ai のアプリで開いてください。");

});



async function startCamera(){

try{

stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});

video.srcObject = stream; video.hidden=false; preview.hidden=true; empty.hidden=true;

mainBtn.textContent="この画面で判定";

setStatus("赤枠と2枚のカードがはっきり映ったら「この画面で判定」を押してください。");

}catch(e){

setStatus("カメラを起動できませんでした。下の「写真を撮って判定」を使ってください。");

mainBtn.hidden=true;

}

}



function toBlob(source, w, h){

const max=1024, scale=Math.min(1, max/Math.max(w,h));

const c=document.createElement("canvas");

c.width=Math.round(w*scale); c.height=Math.round(h*scale);

c.getContext("2d").drawImage(source,0,0,c.width,c.height);

return new Promise(r => c.toBlob(r,"image/jpeg",.85));

}



const PROMPT = `この写真には、赤い線で描かれた枠（テープ・紙・マットなど）と、トランプのカードが写っている可能性があります。

まず赤い枠があるかを確認し、次に枠の内側に完全に収まっているカードと、枠の外や枠にはみ出しているカードを区別して読み取ってください。

数字の10と、マーク（ハート♥/スペード♠/ダイヤ♦/クラブ♣）をよく確認してください。クラブとスペードを取り違えないよう、形を慎重に見てください。

判定:

frame: 赤い枠が写っていれば true
heart10: ハートの10が赤枠の内側に完全に収まっていれば true（枠の外・はみ出し・枠がない場合は false）
club10: クラブの10が赤枠の内側に完全に収まっていれば true（同上）
次のJSONだけを返してください（説明文やコードブロックは不要）:

{"frame":true or false,"inside":["枠の内側のカードを『ハート10』『クラブK』のような日本語で"],"outside":["枠の外やはみ出しているカード"],"heart10":true or false,"club10":true or false}`;



async function judge(blob){

if(busy) return;

if(!sample){ setStatus("カード判定が使えない環境です。"); return; }

busy=true; mainBtn.disabled=true;

setStatus("判定中…");

try{

const r = await sample.json(PROMPT, {images:[blob], modelTier:"quick", cache:false});

const frame=!!r.frame, h=frame&&!!r.heart10, s=frame&&!!r.club10;

$("c-h").classList.toggle("found",h);

$("c-s").classList.toggle("found",s);

const list = a => Array.isArray(a)&&a.length ? a.join("、") : "なし";

if(h&&s){ $("win").classList.add("show"); setStatus(""); }

else if(!frame){

setStatus("<strong>まだ扉は開きません。</strong>赤い枠が見つかりませんでした。枠全体が写るように撮ってください。");

}

else{

const missing=[!s&&"クラブの10",!h&&"ハートの10"].filter(Boolean).join("と");

setStatus(`<strong>まだ扉は開きません。</strong>赤枠の中に${missing}がありません。<br>枠の中：${list(r.inside)}<br>枠の外・はみ出し：${list(r.outside)}`);

}

}catch(e){

const msg = {

not_granted:"Claudeの利用が許可されませんでした。許可すると判定できます。",

rate_limited:"判定が混み合っています。少し待ってからもう一度押してください。",

images_unavailable:"この環境では画像を送れません。"

}[e.code] || "判定に失敗しました。もう一度試してください。";

setStatus(msg);

}finally{ busy=false; mainBtn.disabled=false; }

}



mainBtn.onclick = async () => {

if(!stream){ startCamera(); return; }

if(!video.videoWidth) return;

judge(await toBlob(video, video.videoWidth, video.videoHeight));

};



fileIn.onchange = async () => {

const f=fileIn.files[0]; if(!f) return;

const img=new Image();

img.onload = async () => {

preview.src=img.src; preview.hidden=false; video.hidden=true; empty.hidden=true;

judge(await toBlob(img, img.naturalWidth, img.naturalHeight));

};

img.src=URL.createObjectURL(f);

fileIn.value="";

};



$("again").onclick = () => {

$("win").classList.remove("show");

$("c-h").classList.remove("found"); $("c-s").classList.remove("found");

setStatus("");

};

</script>

</body>

</html>
